plugins {
    id 'org.beryx.runtime' version '1.12.5'
}

sourceCompatibility = 1.17

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = [ "res/" ]

project.ext.mainClassName = "com.matrixeater.src.MainFrame"

application {
    mainClass = project.ext.mainClassName
    applicationName = 'drms'
    applicationDefaultJvmArgs = []
}

// ship the stock particle library with the app (Add > Particle)
distributions {
    main {
        contents {
            from('stock') {
                into 'stock'
            }
        }
    }
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    modules = ['java.desktop', 'java.scripting', 'java.logging', 'java.xml', 'java.datatransfer', 'jdk.dynalink', 'jdk.unsupported']
}

// Headless model format regression check, see com.hiveworkshop.wc3.tools.RoundTripCheck
task roundTrip(type: JavaExec) {
    group = 'verification'
    description = 'Load/save/reload every .mdx from an install or folder: -PrtArgs="--install /path --limit 500"'
    mainClass = 'com.hiveworkshop.wc3.tools.RoundTripCheck'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'java.awt.headless', 'true'
    def rtArgs = project.findProperty('rtArgs')
    if (rtArgs) {
        // split on spaces except inside single quotes so paths with spaces work
        args = (rtArgs =~ /'[^']*'|\S+/).collect { it.replaceAll(/^'|'$/, '') }
    }
}

task dist(type: Jar) {
    // the plain `jar` task writes matrixeater-<version>.jar; keep the fat jar apart
    archiveClassifier = 'all'
 	duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    doFirst {
        def serviceDir = file("$buildDir/META-INF/services")
        serviceDir.deleteDir()
        serviceDir.mkdirs()

        // copy all service files from deps to buildDir
        for(file in configurations.runtimeClasspath) {
            zipTree(file).matching{ include 'META-INF/services/*' }.each { f ->
                new File(serviceDir, f.name) << f.getText("UTF-8") + "\n"
            }
        }
    }
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath

    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    // the per-jar service files are replaced by the merged copies built in doFirst,
    // otherwise only one ImageIO plugin (BLP or DDS) survives the duplicate exclusion
    from({configurations.runtimeClasspath.collect {zipTree(it)}}) {
        exclude 'META-INF/services/**'
    }
    from("$buildDir/META-INF/services") {
        into 'META-INF/services'
    }

    with jar
}

dist.dependsOn classes

eclipse.project {
    name = appName + "-matrixeater"
}
